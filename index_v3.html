<head>
  <style> body { margin: 0; } </style>

  <script src="//cdn.jsdelivr.net/npm/3d-force-graph"></script>
  <!--<script src="../../dist/3d-force-graph.js"></script>-->
</head>

<body>
  <div id="3d-graph"></div>

  <script>
    // Hand-written graph: 10 nodes and the links between them
    const gData = {
      nodes: [
        { id: 0, color: 'DarkRed' },
        { id: 1, color: 'Crimson' },
        { id: 2, color: 'DarkOrange' },
        { id: 3, color: 'Gold' },
        { id: 4, color: 'GreenYellow' },
        { id: 5, color: 'ForestGreen' },
        { id: 6, color: 'DodgerBlue' },
        { id: 7, color: 'Indigo' },
        { id: 8, color: 'HotPink' },
        { id: 9, color: 'LightCoral' }
      ],
      links: [
        { source: 1, target: 0, width: 3 },
        { source: 2, target: 0, width: 3 },
        { source: 3, target: 0, width: 3 },
        { source: 4, target: 1, width: 1 },
        { source: 5, target: 1, width: 6 },
        { source: 6, target: 2, width: 6 },
        { source: 7, target: 3, width: 6 },
        { source: 8, target: 3, width: 6 },
        { source: 9, target: 4, width: 6 }
      ]
    };

    const Graph = new ForceGraph3D(document.getElementById('3d-graph'))
        .graphData(gData)
        .nodeColor('color')    // read each node's color from its "color" property
        .linkWidth('width');   // read each link's width from its "width" property
  </script>
</body>
