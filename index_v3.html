</head>

<body>
  <div id="3d-graph"></div>

  <script>
    // Hand-written graph: 10 nodes and the links between them
    const gData = {
      nodes: [
        { id: 0, color: 'DarkRed' },
        { id: 1, color: 'Crimson' },
        { id: 2, color: 'DarkOrange' },
        { id: 3, color: 'Gold' },
        { id: 4, color: 'GreenYellow' },
        { id: 5, color: 'ForestGreen' },
        { id: 6, color: 'DodgerBlue' },
        { id: 7, color: 'Indigo' },
        { id: 8, color: 'HotPink' },
        { id: 9, color: 'LightCoral' }
      ],
      links: [
        { source: 1, target: 0 },
        { source: 2, target: 0 },
        { source: 3, target: 0 },
        { source: 4, target: 1 },
        { source: 5, target: 1 },
        { source: 6, target: 2 },
        { source: 7, target: 3 },
        { source: 8, target: 3 },
        { source: 9, target: 4 }
      ]
    };

    const Graph = new ForceGraph3D(document.getElementById('3d-graph'))
        .graphData(gData);
  </script>
</body>
