<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>3D Force Graph</title>
  <style> body { margin: 0; } </style>

  <script src="//cdn.jsdelivr.net/npm/3d-force-graph"></script>
</head>

<body>
  <div id="3d-graph"></div>

  <script>
    // 10 nodes, each with a name, color, and size (val).
    // Add a "url" property to any node that should link to a page.
    const gData = {
      nodes: [
        { id: 0, name: 'Beverly Guy Sheftall', color: 'red',             val: 10, url: 'bios.html' },
        { id: 1, name: 'Alice Walker',          color: 'orange',          val: 8 },
        { id: 2, name: 'Johnetta Betsch Cole',  color: 'yellow',          val: 8 },
        { id: 3, name: 'bell hooks',            color: 'lime',            val: 8 },
        { id: 4, name: 'Zora Neale Hurston',    color: 'cyan',            val: 5 },
        { id: 5, name: 'Barbara Smith',         color: 'dodgerblue',      val: 5 },
        { id: 6, name: 'Sojourner Truth',       color: 'violet',          val: 5 },
        { id: 7, name: 'Audre Lorde',           color: '#ff69b4',         val: 3 },
        { id: 8, name: 'Patricia Hill Collins', color: '#ffffff',         val: 3 },
        { id: 9, name: 'June Jordan',           color: 'rgb(150, 75, 0)', val: 1 }
      ],
      links: [
        { source: 1, target: 0, width: 4 },
        { source: 2, target: 0, width: 4 },
        { source: 3, target: 0, width: 4 },
        { source: 4, target: 1, width: 2 },
        { source: 5, target: 1, width: 2 },
        { source: 6, target: 2, width: 2 },
        { source: 7, target: 3, width: 1 },
        { source: 8, target: 3, width: 1 },
        { source: 9, target: 4, width: 0.5 }
      ]
    };

    const elem = document.getElementById('3d-graph');

    const Graph = new ForceGraph3D(elem)
        .graphData(gData)
        .nodeLabel('name')     // show each node's name on hover
        .nodeColor('color')    // read each node's color from its "color" property
        .nodeVal('val')        // read each node's size from its "val" property
        .linkWidth('width')    // read each link's width from its "width" property
        .onNodeClick(node => {
          if (node.url) window.open(node.url, '_blank');   // only open nodes that have a url
        })
        .onNodeHover(node => {
          elem.style.cursor = node && node.url ? 'pointer' : null;   // hand cursor on linkable nodes
        });
  </script>
</body>
</html>
